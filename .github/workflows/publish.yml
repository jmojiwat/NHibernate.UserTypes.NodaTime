name: Publish to NuGet

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Package Version to publish (e.g. 1.0.0)'
        required: true
        type: string

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine Package Version
        id: get_version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $ver = '${{ inputs.version }}'.Trim().TrimStart('v')
          } else {
            $ver = '${{ github.ref_name }}'.Trim().TrimStart('v')
          }
          Write-Host "Determined Version: $ver"
          "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Start LocalDB & Create Test Databases
        shell: pwsh
        run: |
          sqllocaldb start mssqllocaldb
          $conn = New-Object System.Data.SqlClient.SqlConnection('Data Source=(localdb)\mssqllocaldb;Initial Catalog=master;Integrated Security=True;')
          $conn.Open()
          $cmd = $conn.CreateCommand()
          $cmd.CommandText = @"
          IF NOT EXISTS (SELECT * FROM sys.databases WHERE name = 'nodatime') CREATE DATABASE nodatime;
          IF NOT EXISTS (SELECT * FROM sys.databases WHERE name = 'nodatimemappinghelpers') CREATE DATABASE nodatimemappinghelpers;
          "@
          $null = $cmd.ExecuteNonQuery()
          $conn.Close()
          Write-Host "LocalDB test databases ensured."

      - name: Restore dependencies
        run: dotnet restore src/NHibernate.UserTypes.NodaTime.slnx

      - name: Build solution
        run: dotnet build src/NHibernate.UserTypes.NodaTime.slnx -c Release --no-restore

      - name: Run tests (quality gate)
        run: dotnet test src/NHibernate.UserTypes.NodaTime.slnx -c Release --no-build

      - name: Pack NuGet package
        run: dotnet pack src/NHibernate.UserTypes.NodaTime/NHibernate.UserTypes.NodaTime.csproj -c Release -p:PackageVersion=${{ steps.get_version.outputs.version }} -o ./artifacts

      - name: Authenticate with NuGet (OIDC Trusted Publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: jmojiwat

      - name: Push to NuGet.org
        shell: pwsh
        run: |
          $packages = Get-ChildItem -Path artifacts -Filter *.nupkg
          if (-not $packages) { Write-Error "No .nupkg found in artifacts"; exit 1 }
          foreach ($pkg in $packages) {
            dotnet nuget push $pkg.FullName --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Attach package to GitHub Release
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release upload ${{ github.ref_name }} (Get-Item ./artifacts/*.nupkg).FullName --clobber
